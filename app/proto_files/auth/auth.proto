syntax = "proto3";

package auth;

// =============================================================================
// Auth Service — UUID-based credentials (auth.auth_users)
// Profile data lives in user_service; gateway orchestrates registration.
// =============================================================================

service AuthService {
  rpc RegisterCredentials (RegisterCredentialsRequest) returns (GenericResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc IssueTokens (IssueTokensRequest) returns (LoginResponse);
  rpc VerifyGoogleToken (VerifyGoogleTokenRequest) returns (OAuthProfileResponse);
  rpc VerifyFacebookToken (VerifyFacebookTokenRequest) returns (OAuthProfileResponse);
  rpc GoogleSignIn (GoogleSignInRequest) returns (LoginResponse);
  rpc FacebookSignIn (FacebookSignInRequest) returns (LoginResponse);
  rpc SendMobileOTP (MobileOTPRequest) returns (OTPResponse);
  rpc VerifyMobileOTP (VerifyMobileOTPRequest) returns (LoginResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc SendOTP (OTPRequest) returns (OTPResponse);
  rpc VerifyOTP (VerifyOTPRequest) returns (VerifyOTPResponse);
  rpc ForgotPassword (ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
}

message GenericResponse {
  bool success = 1;
  string message = 2;
}

message AuthUserInfo {
  string user_id = 1;
  string email = 2;
  string role = 3;
  string auth_provider = 4;
  string status = 5;
}

message RegisterCredentialsRequest {
  string user_id = 1;
  string password = 2;
  string auth_provider = 3;
}

message LoginRequest {
  string user_id = 1;
  string password = 2;
  string email = 3;
  string role = 4;
}

message IssueTokensRequest {
  string user_id = 1;
  string email = 2;
  string role = 3;
}

message VerifyGoogleTokenRequest {
  string id_token = 1;
}

message VerifyFacebookTokenRequest {
  string access_token = 1;
}

message OAuthProfileResponse {
  bool success = 1;
  string message = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  string picture_url = 6;
  bool email_verified = 7;
}

message GoogleSignInRequest {
  string id_token = 1;
  string user_id = 2;
  string email = 3;
  string role = 4;
}

message FacebookSignInRequest {
  string access_token = 1;
  string user_id = 2;
  string email = 3;
  string role = 4;
}

message MobileOTPRequest {
  string user_id = 1;
  string phone = 2;
}

message VerifyMobileOTPRequest {
  string user_id = 1;
  string phone = 2;
  string otp_code = 3;
  string email = 4;
  string role = 5;
}

message LoginResponse {
  string token = 1;
  string refresh_token = 2;
  AuthUserInfo auth_user = 3;
}

message OTPRequest {
  string user_id = 1;
  string email = 2;
  string phone = 3;
  OTPType type = 4;
}

enum OTPType {
  VERIFICATION = 0;
  PASSWORD_RESET = 1;
  LOGIN = 2;
}

message OTPResponse {
  bool success = 1;
  string message = 2;
  repeated string channels = 3;
}

message VerifyOTPRequest {
  string user_id = 1;
  string email = 2;
  string otp_code = 3;
  OTPType type = 4;
}

message VerifyOTPResponse {
  bool success = 1;
  string message = 2;
  string token = 3;
  AuthUserInfo auth_user = 4;
}

message ForgotPasswordRequest {
  string user_id = 1;
  string email = 2;
  string phone = 3;
}

message ForgotPasswordResponse {
  bool success = 1;
  string message = 2;
  repeated string channels = 3;
}

message ResetPasswordRequest {
  string user_id = 1;
  string email = 2;
  string otp_code = 3;
  string new_password = 4;
  string confirm_password = 5;
}

message ResetPasswordResponse {
  bool success = 1;
  string message = 2;
  AuthUserInfo auth_user = 3;
}

message LogoutRequest {
  string token = 1;
  string refresh_token = 2;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string message = 2;
  AuthUserInfo auth_user = 3;
}
